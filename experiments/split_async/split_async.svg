<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520"><title>SIFT100M 分離布局與 host 非同步搜尋</title><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#29436c"/></marker></defs><rect width="1000" height="520" fill="white"/><g font-family="Noto Sans CJK TC,Microsoft JhengHei,sans-serif" fill="#222" font-size="15"><text x="500" y="30" font-size="21" text-anchor="middle">SIFT100M：Neighbor-only Block Shuffle × Host Async I/O</text><rect x="20" y="60" width="290" height="350" fill="#fff" stroke="#29436c"/><text x="165" y="85" font-size="17" text-anchor="middle">SSD：分離資料布局</text><rect x="35" y="105" width="260" height="110" fill="#e4edf8" stroke="#29436c"/><text x="165.0" y="128" font-size="15" text-anchor="middle">Neighbor page · 4 KiB</text><text x="165.0" y="151" font-size="15" text-anchor="middle">block shuffle：15 筆 adjacency lists</text><text x="165.0" y="174" font-size="15" text-anchor="middle">a₇   a₂₁   a₃   …   a₉</text><text x="165.0" y="197" font-size="15" text-anchor="middle">雙向 maps ↔ 原始 logical IDs</text><rect x="35" y="245" width="260" height="105" fill="#fae6da" stroke="#29436c"/><text x="165.0" y="268" font-size="15" text-anchor="middle">Full-vector page · 4 KiB</text><text x="165.0" y="291" font-size="15" text-anchor="middle">原始 ID 順序：32 × uint8[128]</text><text x="165.0" y="314" font-size="15" text-anchor="middle">v₀   v₁   v₂   …   v₃₁</text><text x="165" y="386" font-size="14" text-anchor="middle">讀取整頁；向量只精算指定 ID</text><rect x="335" y="60" width="285" height="95" fill="#f5f4e5" stroke="#29436c"/><text x="477.5" y="83" font-size="15" text-anchor="middle">Host RAM</text><text x="477.5" y="106" font-size="15" text-anchor="middle">PQ codes ＋ query 距離查表</text><text x="477.5" y="129" font-size="15" text-anchor="middle">L 容量候選佇列 ＋ 已展開頁集合</text><rect x="680" y="60" width="280" height="55" fill="#fff" stroke="#29436c"/><text x="820.0" y="83" font-size="15" text-anchor="middle">Query → medoid 初始化</text><rect x="680" y="145" width="280" height="70" fill="#fff" stroke="#29436c"/><text x="820.0" y="168" font-size="15" text-anchor="middle">Beam：選出至多 W 個節點</text><text x="820.0" y="191" font-size="15" text-anchor="middle">同時提交 graph / vector reads</text><path d="M820 115 L820 145" fill="none" stroke="#29436c" marker-end="url(#a)"/><path d="M620 110 L680 110" fill="none" stroke="#29436c" marker-end="url(#a)"/><rect x="335" y="235" width="285" height="90" fill="#e4edf8" stroke="#29436c"/><text x="477.5" y="258" font-size="15" text-anchor="middle">Graph 完成後：Host PQ</text><text x="477.5" y="281" font-size="15" text-anchor="middle">頁內全部有效節點 ＋ 新發現鄰居</text><text x="477.5" y="304" font-size="15" text-anchor="middle">展開整頁 adjacency lists</text><rect x="680" y="245" width="280" height="80" fill="#fae6da" stroke="#29436c"/><text x="820.0" y="268" font-size="15" text-anchor="middle">Vector 完成後：Host exact L2</text><text x="820.0" y="291" font-size="15" text-anchor="middle">僅計算 beam 指定節點</text><text x="820.0" y="314" font-size="15" text-anchor="middle">結果加入 exact list</text><path d="M310 165 L335 265" fill="none" stroke="#29436c" marker-end="url(#a)"/><path d="M295 340 L320 340 L320 355 L650 355 L650 290 L680 290" fill="none" stroke="#29436c" marker-end="url(#a)"/><path d="M750 215 L550 235" fill="none" stroke="#29436c" marker-end="url(#a)"/><path d="M820 215 L820 245" fill="none" stroke="#29436c" marker-end="url(#a)"/><rect x="680" y="375" width="280" height="55" fill="#fff" stroke="#29436c"/><text x="820.0" y="398" font-size="15" text-anchor="middle">等待本 beam 完成</text><path d="M620 315 L680 395" fill="none" stroke="#29436c" marker-end="url(#a)"/><path d="M820 325 L820 375" fill="none" stroke="#29436c" marker-end="url(#a)"/><path d="M960 400 L980 400 L980 180 L960 180" fill="none" stroke="#29436c" marker-end="url(#a)"/><text x="820" y="453" font-size="15" text-anchor="middle">候選耗盡 → exact list 排序 → Top-K</text><path d="M820 430 L820 437" fill="none" stroke="#29436c" marker-end="url(#a)"/><text x="480" y="390" font-size="13" text-anchor="middle">Graph page：同 query 只展開一次</text><text x="480" y="412" font-size="13" text-anchor="middle">Exact distance 不回饋 PQ 探索</text><text x="500" y="494" font-size="14" text-anchor="middle">所有計算在 Host；保留每個 beam 的完成屏障，並非跨 beam 的持續流水線。</text></g></svg>